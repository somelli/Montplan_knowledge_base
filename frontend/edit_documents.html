<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="edit_documents.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    </style>
    <title>База знаний Монтплан</title>
</head>

<body>
    <div class="sidebar">
        <div class="logo_block">
            <img src="./src/image/logo.png" alt="logo">
            <span>Монтплан</span>
        </div>

        <nav id="sidebarNav">
            <!-- Меню будет генерироваться динамически -->
        </nav>

        <div class="logout_container">
            <div class="logout_block">
                <img src="./src/image/logout.png" alt="Выйти">
                <a href="#" id="logoutLink">Выйти</a>
            </div>
        </div>
    </div>

    <main>
        <header>
            <button id="back_btn" class="back_btn">
                <img src="./src/image/back.png" alt="Назад">
                <span>Назад</span>
            </button>

            <div class="user_block">
                <div class="user_info">
                    <span>Загрузка...</span>
                    <div class="user_role">Загрузка...</div>
                </div>
                
                <img src="./src/image/account_round_icon.png" alt="Аккаунт">
            </div>
        </header>

        <div class="content_block">
            <div class="header_container">
                <div class="main_title">Редактирование документа</div>

                <div class="buttons_container">
                    <button class="action_button" id="archive_btn">
                        <img src="./src/image/archive_blue.png" alt="Архивировать">
                    </button>

                    <button class="action_button" id="delete_btn">
                        <img src="./src/image/delete.png" alt="Удалить">
                    </button>
                </div>
            </div>
            
            <div class="form_container">
                <form id="documentForm">
                    <div class="form_group">
                        <label for="documentName">Название документа</label>
                        <div class="document_input_block">
                            <input type="text" id="documentName" maxlength="50" placeholder="Введите название документа" oninput="document.getElementById('documentNameCounter').innerText=this.value.length+'/50'">
                            <span class="counter" id="documentNameCounter">0/50</span>
                        </div>
                    </div>

                    <div class="form_group">
                        <label for="categories">Категория</label>
                        <div class="custom_select" id="categorySelect" tabindex="0">
                            <span class="selected">Выберите категорию</span>
                            <div class="select_dropdown">
                                <!-- Опции будут добавлены через JS -->
                            </div>
                        </div>
                    </div>

                    <div class="form_group">
                        <label for="tags">Теги</label>

                        <!-- Отображение выбранных тегов -->
                        <div class="tags_input" id="tagsInput" tabindex="0">
                            <div class="tags_list" id="tagsList"></div>
                            <input type="text" placeholder="Выбирите до 3 тегов" id="tagsSearch" autocomplete="off">
                        </div>

                        <!-- Выпадающий список с чекбоксами -->
                        <div class="tags_dropdown" id="tagsDropdown">
                            <div id="tagsOptions">
                                <!-- Опции будут добавлены через JS -->
                            </div>
                        </div>
                    </div>
                    <button class="submit_button" type="submit">Сохранить изменения</button>
                </form>
            </div>
        </div>

        <!-- Модальное окно оповещения о загрузке -->
        <div id="successModal" class="modal_container">
            <div class="modal_block">
                <div class="modal_header">
                    <h2>Документ успешно изменен!</h2>
                    <button class="modal_close"><img src="./src/image/close.png" alt="Закрыть"></button>
                </div>
                <div class="modal_body">
                    <p>Данные документа <strong id="uploadedDocName">Название документа</strong> были успешно изменены.</p>
                </div>
                <div class="form_actions">
                    <button type="button" class="modal_cancel">Закрыть</button>
                </div>
            </div>
        </div>

        <!-- Модальное окно для ошибок и уведомлений -->
        <div id="messageModal" class="modal_container">
            <div class="modal_block">
                <div class="modal_header">
                    <h2 id="messageModalTitle">Ошибка</h2>
                    <button class="modal_close"><img src="./src/image/close.png" alt="Закрыть"></button>
                </div>
                <div class="modal_body">
                    <p id="messageModalText">Сообщение</p>
                </div>
                <div class="form_actions">
                    <button type="button" class="modal_cancel">Закрыть</button>
                </div>
            </div>
        </div>

        <!-- Модальное окно для подтверждения действий -->
        <div id="messageDeleteArchiveModal" class="modal_container">
            <div class="modal_block">
                <div class="modal_header">
                    <h2 id="messageModalTitle">Подтверждение</h2>
                    <button class="modal_close"><img src="./src/image/close.png" alt="Закрыть"></button>
                </div>
                <div class="modal_body">
                    <p id="messageModalText">Сообщение</p>
                </div>
                <div class="form_actions">
                    <button type="button" class="modal_cancel">Отмена</button>
                    <button type="button" class="modal_submit">Подтвердить</button>
                </div>
            </div>
        </div>

        <!-- Модальное окно успеха -->
        <div id="successDeleteArchiveModal" class="modal_container">
            <div class="modal_block">
                <div class="modal_header">
                    <h2>Успешно!</h2>
                    <button class="modal_close"><img src="./src/image/close.png" alt="Закрыть"></button>
                </div>
                <div class="modal_body">
                    <p>Операция выполнена успешно.</p>
                </div>
                <div class="form_actions">
                    <button type="button" class="modal_cancel">Закрыть</button>
                </div>
            </div>
        </div>
    </main>

    <script src="./navigation.js"></script>
    <script src="./edit_documents.js"></script>
</body>
</html>
