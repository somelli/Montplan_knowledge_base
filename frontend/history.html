<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="account.css">
    <link href="media_screen.css" rel="stylesheet" type="text/css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    </style>
    <title>История просмотров — Монтплан</title>
</head>

<body>
    <div class="sidebar">
        <div class="logo_block">
            <img src="./src/image/logo.png" alt="logo">
            <span>Монтплан</span>
        </div>

        <nav id="sidebarNav">
            <!-- Меню будет генерироваться динамически -->
        </nav>

        <div class="logout_container">
            <div class="logout_block">
                <img src="./src/image/logout.png" alt="Выйти">
                <a href="#" id="logoutLink">Выйти</a>
            </div>
        </div>
    </div>

    <main>
        <header>
            <button id="backButton" class="back_to_list">
                <img src="./src/image/back.png" alt="Назад">
                <span>Назад</span>
            </button>

            <div class="user_block">
                <div class="user_info">
                    <span>Загрузка...</span>
                    <div class="user_role">Загрузка...</div>
                </div>
                <img src="./src/image/account_round_icon.png" alt="Аккаунт">
            </div>
        </header>

        <div class="content_block">
            <div class="all_history_section">
                <div class="history_header">
                    <div class="header_title">
                        <img src="/src/image/time.png" alt="История просмотров">
                        <div class="history_title">История просмотров</div>
                    </div>

                    <button class="clear_history_btn">
                        <img src="./src/image/delete.png" alt="Очистить">
                    </button>
                </div>

                <div class="history_docs" id="viewHistoryList">
                    <!-- История будет загружаться здесь -->
                </div>
            </div>
        </div>
    </main>

    <!-- Модальное окно подтверждения удаления -->
    <div id="deleteConfirmModal" class="modal_container">
        <div class="modal_block">
            <div class="modal_header">
                <h2>Подтвердите удаление</h2>
                <button class="modal_close"><img src="./src/image/close.png" alt="Закрыть"></button>
            </div>
            <div class="modal_body">
                <p>Вы уверены, что хотите очистить всю историю просмотров? <br> Это действие нельзя отменить.</p>
            </div>
            <div class="form_actions" style="padding: 20px 30px; margin: 0;">
                <button type="button" class="modal_cancel">Отмена</button>
                <button type="button" class="modal_submit" id="confirmDeleteBtn">Очистить</button>
            </div>
        </div>
    </div>

    <script src="./navigation.js"></script>
    <script src="./history.js"></script>
</body>
</html>
